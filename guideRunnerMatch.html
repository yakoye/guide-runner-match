<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助盲团智能配对系统 v3.0</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-title {
            font-weight: 300;
            letter-spacing: 2px;
            color: #2c3e50;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .upload-area {
            display: block;
            text-align: center;
            padding: 60px 20px;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        .upload-area:hover, .upload-area.is-dragover {
            border-color: #409EFF;
            background-color: #ecf5ff;
        }
        .result-box {
            background-color: #fafafa;
            padding: 20px;
            border-radius: 4px;
            font-family: "PingFang SC", "Microsoft YaHei", monospace;
            white-space: pre-wrap;
            margin-top: 10px;
            border: 1px solid #eaeaea;
            font-size: 14px;
            line-height: 1.6;
        }
        .remark-text {
            font-size: 12px;
            color: #909399;
            display: block;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .section-title {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 4px solid #409EFF;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 class="header-title">🏔️ 助盲团智能配对系统</h1>
            
            <div v-if="!dataLoaded">
                <label class="upload-area" 
                       :class="{ 'is-dragover': dragOver }"
                       @dragover.prevent="dragOver = true"
                       @dragleave.prevent="dragOver = false"
                       @drop.prevent="handleDrop"
                       for="fileInput">
                    <input type="file" id="fileInput" @change="handleFileUpload" accept=".xlsx, .xls, .csv" multiple style="display: none" />
                    <el-icon :size="50" color="#909399"><upload-filled /></el-icon>
                    <h3 style="font-weight: 400; color: #303133; margin-top: 20px;">拖拽报名表及状态表至此处</h3>
                    <p style="color: #909399; font-size: 14px;">已增强空格清洗，完美识别近期状态</p>
                </label>
            </div>

            <div v-else>
                <el-row justify="space-between" align="middle" style="margin-bottom: 20px;">
                    <div>
                        <h2 style="margin: 0; display: inline-block; margin-right: 15px;">主配对台</h2>
                        <el-tag type="info">共 {{ blindRunners.length }} 位盲友</el-tag>
                    </div>
                    <div>
                        <el-button type="primary" plain @click="autoPair">自动预匹配</el-button>
                        <el-button plain @click="resetData">返回重选文件</el-button>
                    </div>
                </el-row>

                <el-table :data="blindRunners" style="width: 100%" stripe border>
                    <el-table-column prop="姓名" label="盲友" width="90" fixed></el-table-column>
                    <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                    <el-table-column label="近期状态" width="100" align="center">
                        <template #default="scope">
                            <el-tag :type="getStatusColor(scope.row._status)" size="small" effect="light">
                                {{ scope.row._status || '无记录' }}
                            </el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                    
                    <el-table-column label="志愿者配对 (选择)">
                        <template #default="scope">
                            <el-select 
                                v-model="scope.row._matchedVolunteer" 
                                filterable 
                                clearable 
                                placeholder="选择志愿者"
                                style="width: 100%;">
                                <el-option
                                    v-for="vol in volunteers"
                                    :key="vol['姓名']"
                                    :label="vol['姓名']"
                                    :value="vol['姓名']"
                                    :disabled="isVolunteerAssigned(vol['姓名']) && scope.row._matchedVolunteer !== vol['姓名']">
                                    <span style="float: left"><strong>{{ vol['姓名'] }}</strong> ({{ vol['年龄'] || '?' }}岁)</span>
                                    <span style="float: right; color: #8492a6; font-size: 12px">
                                        {{ vol['您参加快组或者慢组？'] }} | {{ vol['性别'] }}
                                    </span>
                                </el-option>
                            </el-select>
                        </template>
                    </el-table-column>
                    
                    <el-table-column label="志愿年龄" width="90" align="center">
                        <template #default="scope">
                            <span :style="{ color: getVolAge(scope.row._matchedVolunteer) ? '#333' : '#ccc' }">
                                {{ getVolAge(scope.row._matchedVolunteer) || '-' }}
                            </span>
                        </template>
                    </el-table-column>

                    <el-table-column label="综合备注 (后置)" min-width="150">
                        <template #default="scope">
                            <el-tooltip :content="getCombinedRemark(scope.row)" placement="top" v-if="getCombinedRemark(scope.row)">
                                <span class="remark-text">{{ getCombinedRemark(scope.row) }}</span>
                            </el-tooltip>
                            <span v-else style="color: #ccc;">-</span>
                        </template>
                    </el-table-column>
                </el-table>

                <div v-if="unassignedVolunteers.length > 0 || unassignedRunners.length > 0">
                    <h3 class="section-title">闲置人员池 (不对等情况)</h3>
                    <el-row :gutter="20">
                        <el-col :span="12" v-if="unassignedVolunteers.length > 0">
                            <el-table :data="unassignedVolunteers" style="width: 100%" size="small" border stripe>
                                <el-table-column prop="姓名" label="未分配志愿者" width="100"></el-table-column>
                                <el-table-column prop="年龄" label="年龄" width="60"></el-table-column>
                                <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                <el-table-column prop="备注" label="备注" show-overflow-tooltip></el-table-column>
                            </el-table>
                        </el-col>
                        <el-col :span="12" v-if="unassignedRunners.length > 0">
                            <el-table :data="unassignedRunners" style="width: 100%" size="small" border stripe>
                                <el-table-column prop="姓名" label="待分配盲友" width="100"></el-table-column>
                                <el-table-column prop="年龄" label="年龄" width="60"></el-table-column>
                                <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                <el-table-column prop="备注" label="备注" show-overflow-tooltip></el-table-column>
                            </el-table>
                        </el-col>
                    </el-row>
                </div>

                <div style="margin-top: 40px; border-top: 1px solid #eaeaea; padding-top: 20px;">
                    <el-row justify="space-between" align="middle">
                        <h2>微信发布格式预览 (单备注列)</h2>
                        <el-button type="primary" @click="copyToClipboard">一键复制发布内容</el-button>
                    </el-row>
                    <div class="result-box">{{ generateResultText() }}</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        const app = createApp({
            setup() {
                const dragOver = ref(false);
                const dataLoaded = ref(false);
                const blindRunners = ref([]);
                const volunteers = ref([]);
                const statusMap = ref({});

                const getStatusColor = (s) => {
                    if (!s || s === '无记录') return 'info';
                    return s.includes('轻松') ? 'success' : (s.includes('累') ? 'danger' : 'warning');
                };

                const isVolunteerAssigned = (n) => blindRunners.value.some(r => r._matchedVolunteer === n);

                // 获取联动的志愿者年龄
                const getVolAge = (volName) => {
                    if (!volName) return '';
                    const v = volunteers.value.find(v => v['姓名'] === volName);
                    return v && v['年龄'] ? v['年龄'] : '';
                };

                // 合并盲友和志愿者的备注
                const getCombinedRemark = (runner) => {
                    let remarks = [];
                    if (runner['备注']) remarks.push(`盲友:${runner['备注']}`);
                    const vObj = volunteers.value.find(v => v['姓名'] === runner._matchedVolunteer);
                    if (vObj && vObj['备注']) remarks.push(`志愿:${vObj['备注']}`);
                    return remarks.join(' | ');
                };

                // 计算未分配的多余人员
                const unassignedVolunteers = computed(() => {
                    return volunteers.value.filter(v => !isVolunteerAssigned(v['姓名']));
                });
                
                const unassignedRunners = computed(() => {
                    return blindRunners.value.filter(r => !r._matchedVolunteer);
                });

                const handleDrop = (e) => { dragOver.value = false; processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => processFiles(e.target.files);

                const processFiles = async (files) => {
                    let rawBlind = new Map();
                    let rawVol = new Map();
                    
                    for (const file of files) {
                        const data = await file.arrayBuffer();
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(name => {
                            const sheetData = extractData(workbook.Sheets[name]);
                            sheetData.forEach(row => {
                                const role = row['您是盲友还是志愿者？'] || '';
                                const userName = row['姓名'];
                                if (!userName) return;

                                if (role.includes('盲友')) {
                                    row._matchedVolunteer = '';
                                    rawBlind.set(userName, row);
                                } else if (role.includes('志愿者')) {
                                    rawVol.set(userName, row);
                                }
                                
                                // 提取状态表（现在更稳健，名字和体感都被深度清理过空格）
                                if ('体感' in row) statusMap.value[userName] = row['体感'];
                            });
                        });
                    }

                    blindRunners.value = Array.from(rawBlind.values()).map(r => ({
                        ...r,
                        _status: statusMap.value[r['姓名']] || '无记录'
                    }));
                    volunteers.value = Array.from(rawVol.values());
                    dataLoaded.value = true;
                    autoPair();
                };

                // 核心修复：强力清洗不可见字符和表头空格
                const extractData = (ws) => {
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    
                    // 寻找包含“姓名”的那一行（忽略空格）
                    const hIdx = raw.findIndex(r => r && r.some(cell => 
                        typeof cell === 'string' && cell.replace(/\s+/g, '') === '姓名'
                    ));
                    
                    if (hIdx === -1) return [];
                    
                    // 把找到的表头彻底去除所有空格和换行
                    const headers = raw[hIdx].map(h => h ? String(h).replace(/\s+/g, '') : `COL_${Math.random()}`);
                    
                    return raw.slice(hIdx + 1).map(r => {
                        let obj = {};
                        headers.forEach((h, i) => {
                            // 给每个单元格的值也做一下头尾去空格，防止名字匹配不上
                            if (r[i] !== undefined) {
                                obj[h] = typeof r[i] === 'string' ? r[i].trim() : r[i];
                            }
                        });
                        return obj;
                    }).filter(r => r['姓名']);
                };

                const autoPair = () => {
                    blindRunners.value.forEach(r => {
                        if (r._matchedVolunteer) return;
                        const v = volunteers.value.find(v => !isVolunteerAssigned(v['姓名']) && v['您参加快组或者慢组？'] === r['您参加快组或者慢组？']);
                        if (v) r._matchedVolunteer = v['姓名'];
                    });
                };

                // 最终输出：取消单独两列备注，合并为一个
                const generateResultText = () => {
                    let text = "【配对结果发布】\n盲友\t全/半\t志愿者\t合并备注\n";
                    blindRunners.value.forEach(r => {
                        const type = (r['您是盲友还是志愿者？'] || '').includes('全') ? '全' : '半';
                        const remark = getCombinedRemark(r) || '-';
                        text += `${r['姓名']}\t${type}\t${r._matchedVolunteer || '待定'}\t${remark}\n`;
                    });
                    return text;
                };

                const copyToClipboard = () => {
                    navigator.clipboard.writeText(generateResultText());
                    ElementPlus.ElMessage.success('已复制，请直接粘贴发布');
                };

                const resetData = () => { dataLoaded.value = false; blindRunners.value = []; volunteers.value = []; statusMap.value = {}; };

                return { dragOver, dataLoaded, blindRunners, volunteers, unassignedVolunteers, unassignedRunners, handleDrop, handleFileUpload, getStatusColor, isVolunteerAssigned, getVolAge, getCombinedRemark, generateResultText, copyToClipboard, resetData, autoPair };
            }
        });

        for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
        app.use(ElementPlus).mount('#app');
    </script>
</body>
</html>
