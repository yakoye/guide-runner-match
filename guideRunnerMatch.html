<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助盲团智能配对系统 v10.0</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://unpkg.com/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-title {
            font-weight: 300;
            letter-spacing: 2px;
            color: #2c3e50;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        .upload-area {
            display: block;
            text-align: center;
            padding: 60px 20px;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        .upload-area:hover, .upload-area.is-dragover {
            border-color: #409EFF;
            background-color: #ecf5ff;
        }
        .section-title {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 4px solid #409EFF;
        }
        .el-textarea__inner {
            font-family: "PingFang SC", "Microsoft YaHei", monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            background-color: #fafafa !important;
        }
        .team-filter-bar {
            background: #ecf5ff;
            border: 1px solid #d9ecff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px dashed #e4e7ed;
        }
        .drag-handle {
            cursor: grab;
            font-size: 18px;
            color: #909399;
            transition: color 0.2s;
            vertical-align: middle;
        }
        .drag-handle:hover { color: #409EFF; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.8; background-color: #ecf5ff !important; }
        
        .exp-dialog-table .el-button { margin-left: 5px; margin-right: 5px; margin-bottom: 4px;}
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 class="header-title">
                🏔️ 助盲团智能配对系统 
                <el-tag type="success" effect="plain" round style="margin-left:15px;">v10.0 终极排版优化版</el-tag>
            </h1>
            
            <div v-if="!dataLoaded">
                <label class="upload-area" 
                       :class="{ 'is-dragover': dragOver }"
                       @dragover.prevent="dragOver = true"
                       @dragleave.prevent="dragOver = false"
                       @drop.prevent="handleDrop"
                       for="fileInput">
                    <input type="file" id="fileInput" @change="handleFileUpload" accept=".xlsx, .xls, .csv" multiple style="display: none" />
                    <el-icon :size="50" color="#909399"><upload-filled /></el-icon>
                    <h3 style="font-weight: 400; color: #303133; margin-top: 20px;">拖拽完整的报名表及状态表至此处</h3>
                    <p style="color: #909399; font-size: 14px;">自动合并全员经验 | 自动时间降级 | 科学提取年龄</p>
                </label>
            </div>

            <div v-else>
                <div class="team-filter-bar">
                    <span style="margin-right: 15px; font-weight: bold; color: #409EFF;">📍 队伍工作区：</span>
                    <el-select v-model="selectedTeam" placeholder="请选择队伍" clearable style="width: 200px;">
                        <el-option v-for="team in availableTeams" :key="team" :label="team" :value="team"></el-option>
                    </el-select>
                    <span style="margin-left: 20px; font-size: 13px; color: #606266;">
                        (报名表最新基准日期：{{ formattedEventDate }})
                    </span>
                    <div style="flex-grow: 1; text-align: right;">
                        <el-button type="primary" plain @click="expDialogVisible = true">⚙️ 管理人员经验 (含盲友)</el-button>
                        <el-button plain size="small" @click="resetData" style="margin-left:10px;">重新导入</el-button>
                    </div>
                </div>

                <div v-if="selectedTeam">
                    <el-row justify="space-between" align="middle" style="margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; display: inline-block; margin-right: 15px;">
                                【{{ selectedTeam }}】配对台
                            </h2>
                            <el-tag type="info">已保证所有盲友全部在此表中列出</el-tag>
                        </div>
                        <div>
                            <el-button type="primary" plain @click="autoPair">智能预配对 (同性+老手优先)</el-button>
                        </div>
                    </el-row>

                    <el-table :data="currentTeamRunners" style="width: 100%" stripe border class="sortable-table" row-key="_uid">
                        
                        <el-table-column width="45" align="center" fixed="left">
                            <template #default="scope">
                                <el-icon class="drag-handle"><Rank /></el-icon>
                            </template>
                        </el-table-column>
                        <el-table-column type="index" label="编号" width="55" align="center" fixed="left"></el-table-column>
                        <el-table-column prop="姓名" label="盲友" width="80" fixed="left"></el-table-column>
                        
                        <el-table-column label="类型" width="60" align="center">
                            <template #default="scope">{{ getBlindType(scope.row) }}</template>
                        </el-table-column>
                        <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                        <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                        
                        <el-table-column label="近期状态" width="90" align="center">
                            <template #default="scope">
                                <el-tag :type="getStatusColor(scope.row._status)" size="small" effect="light">
                                    {{ scope.row._status || '无记录' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="您参加快组或者慢组？" label="意向" width="60"></el-table-column>

                        <el-table-column label="志愿者配对 (下拉选择)">
                            <template #default="scope">
                                <el-select 
                                    v-model="scope.row._matchedVolunteer" 
                                    filterable clearable placeholder="留空即为未配对"
                                    @change="handleVolunteerChange(scope.row)"
                                    style="width: 100%;">
                                    <el-option
                                        v-for="vol in filteredVolunteers" :key="vol['姓名']"
                                        :label="vol['姓名']" :value="vol['姓名']"
                                        :disabled="isVolunteerAssigned(vol['姓名']) && scope.row._matchedVolunteer !== vol['姓名']">
                                        <span style="float: left"><strong>{{ vol['姓名'] }}</strong> ({{ vol['年龄'] || '?' }}岁)</span>
                                        <span style="float: right; color: #8492a6; font-size: 12px">
                                            {{ vol['您参加快组或者慢组？'] }} | {{ vol['性别'] }} | 
                                            <span :style="{ color: getCombinedExpObj(vol).exp >= 10 ? '#E6A23C' : '#67C23A', fontWeight: 'bold' }">
                                                经验:{{ getCombinedExpObj(vol).exp }}次
                                                <span v-if="getCombinedExpObj(vol).isDecayed" style="color:#F56C6C">(久未跑降级)</span>
                                            </span>
                                        </span>
                                    </el-option>
                                </el-select>
                            </template>
                        </el-table-column>
                        
                        <el-table-column label="志愿性别" width="80" align="center">
                            <template #default="scope">
                                <span v-if="getVolGender(scope.row._matchedVolunteer)" 
                                      :style="{ 
                                        fontWeight: 'bold',
                                        color: getVolGender(scope.row._matchedVolunteer) === scope.row['性别'] ? '#67C23A' : '#E6A23C' 
                                      }">
                                    {{ getVolGender(scope.row._matchedVolunteer) }}
                                    <span v-if="getVolGender(scope.row._matchedVolunteer) !== scope.row['性别']" style="font-size:12px;">(异性)</span>
                                </span>
                                <span v-else style="color:#ccc">-</span>
                            </template>
                        </el-table-column>

                        <el-table-column label="标注" width="85">
                            <template #default="scope">
                                <el-input v-model="scope.row._label" placeholder="警示记号" size="small"></el-input>
                            </template>
                        </el-table-column>

                        <el-table-column label="综合备注 (长描述)" min-width="160">
                            <template #default="scope">
                                <el-input v-model="scope.row._customRemark" placeholder="可输入自定义备注" size="small" clearable></el-input>
                            </template>
                        </el-table-column>
                    </el-table>

                    <div v-if="filteredUnassignedVolunteers.length > 0">
                        <h3 class="section-title">闲置人员池 (富余的志愿者)</h3>
                        <el-table :data="filteredUnassignedVolunteers" style="width: 60%" size="small" border stripe>
                            <el-table-column prop="姓名" label="未分配志愿者" width="100"></el-table-column>
                            <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                            <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                            <el-table-column label="有效经验" width="100" align="center">
                                <template #default="scope">
                                    {{ getCombinedExpObj(scope.row).exp }}次
                                    <span v-if="getCombinedExpObj(scope.row).isDecayed" style="color:red; font-size:12px">降级</span>
                                </template>
                            </el-table-column>
                            <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                            <el-table-column prop="备注" label="原始备注" show-overflow-tooltip></el-table-column>
                        </el-table>
                    </div>

                    <div style="margin-top: 40px; border-top: 1px solid #eaeaea; padding-top: 20px;">
                        <el-row justify="space-between" align="middle" style="margin-bottom: 10px;">
                            <h2>微信发布格式预览</h2>
                            <div>
                                <el-button plain @click="forceUpdateText" size="small">🔄 刷新拖拽后排版</el-button>
                                <el-button type="primary" @click="copyToClipboard">一键复制并为全员打卡经验</el-button>
                            </div>
                        </el-row>
                        
                        <el-input
                            type="textarea" v-model="publishText" :rows="12"
                            @focus="isTextFocused = true" @blur="isTextFocused = false"
                            placeholder="配对完成后，发布文案会自动生成在这里...">
                        </el-input>
                    </div>
                </div>
                
                <div v-else class="empty-state">
                    <el-icon :size="60" color="#c0c4cc"><DataBoard /></el-icon>
                    <h2 style="color: #606266; margin-top: 20px; font-weight: 400;">数据导入成功！共提取到 {{ availableTeams.length }} 个队伍</h2>
                    <p style="color: #909399; font-size: 16px;">☝️ 请在上方下拉菜单中，选择您要处理的具体队伍</p>
                </div>
            </div>
            
            <el-dialog v-model="expDialogVisible" title="全员经验值数据库 (包含盲友及志愿者)" width="1000px">
                <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 10px;">
                        <el-select v-model="dialogFilterTeam" placeholder="筛选队伍..." clearable style="width: 180px;">
                            <el-option v-for="team in availableTeams" :key="team" :label="team" :value="team"></el-option>
                            <el-option label="历史记录(不在本次名单)" value="历史记录"></el-option>
                        </el-select>
                        <el-select v-model="dialogFilterRole" placeholder="筛选身份..." clearable style="width: 150px;">
                            <el-option label="盲友" value="盲友"></el-option>
                            <el-option label="志愿者" value="志愿者"></el-option>
                        </el-select>
                    </div>
                    <el-button type="danger" plain size="small" @click="clearExpDB">🗑️ 清空所有记录</el-button>
                </div>
                
                <el-table :data="expDbList" height="500" stripe border class="exp-dialog-table">
                    <el-table-column prop="name" label="姓名" width="90" fixed></el-table-column>
                    <el-table-column prop="role" label="身份" width="80" align="center">
                        <template #default="scope">
                            <el-tag :type="scope.row.role.includes('盲友') ? 'success' : 'primary'" size="small">{{ scope.row.role }}</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column prop="team" label="当前队伍" width="140" show-overflow-tooltip></el-table-column>
                    <el-table-column prop="lastActive" label="最后活跃日期" width="110" align="center"></el-table-column>
                    <el-table-column label="经验次数" width="140" align="center">
                        <template #default="scope">
                            <el-input-number v-model="scope.row.exp" :min="0" size="small" @change="updateSingleExp(scope.row)"></el-input-number>
                        </template>
                    </el-table-column>
                    <el-table-column label="快捷修改 (点此一键赋值)">
                        <template #default="scope">
                            <el-button size="small" type="info" plain @click="setExpLevel(scope.row, 0)">新手(0)</el-button>
                            <el-button size="small" type="success" plain @click="setExpLevel(scope.row, 8)">熟手(8)</el-button>
                            <el-button size="small" type="warning" plain @click="setExpLevel(scope.row, 20)">老兵(20)</el-button>
                            <el-button size="small" type="danger" plain @click="setExpLevel(scope.row, 50)">元老(50)</el-button>
                        </template>
                    </el-table-column>
                </el-table>
            </el-dialog>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch, nextTick } = Vue;

        const app = createApp({
            setup() {
                const dragOver = ref(false);
                const dataLoaded = ref(false);
                const expDialogVisible = ref(false);
                
                const dialogFilterTeam = ref('');
                const dialogFilterRole = ref('');

                const blindRunners = ref([]);
                const volunteers = ref([]);
                const statusMap = ref({});
                const eventDate = ref(new Date()); 
                
                const selectedTeam = ref('');
                const currentTeamRunners = ref([]); 
                const publishText = ref("");
                const isTextFocused = ref(false);

                // 生成随机UID防止拖拽时同名导致的DOM复用BUG
                const generateUID = () => Math.random().toString(36).substring(2, 10);

                // --- 经验数据库加载 ---
                const loadExpDB = () => {
                    let db = JSON.parse(localStorage.getItem('volExpDB_v10'));
                    if (!db) {
                        db = {};
                        const oldDb = JSON.parse(localStorage.getItem('volExpDB_v9') || '{}');
                        for (let name in oldDb) {
                            db[name] = { 
                                exp: oldDb[name].exp || 0, 
                                lastActive: oldDb[name].lastActive || new Date().toISOString().split('T')[0],
                                role: oldDb[name].role || '未知'
                            };
                        }
                        localStorage.setItem('volExpDB_v10', JSON.stringify(db));
                    }
                    return db;
                };
                const volExpDB = ref(loadExpDB());

                const expDbList = computed(() => {
                    const map = new Map();
                    const allCurrent = [...blindRunners.value, ...volunteers.value];
                    allCurrent.forEach(p => {
                        const name = p['姓名'];
                        if(!name) return;
                        const team = p['您参加几队活动？'] ? p['您参加几队活动？'].trim() : '无队伍';
                        const isBlind = (p['您是盲友还是志愿者？'] || '').includes('盲友');
                        const role = isBlind ? '盲友' : '志愿者';
                        
                        let exp = parseInt(p['参加次数']) || 0;
                        let lastActive = '-';
                        if (volExpDB.value[name]) {
                            exp = Math.max(exp, volExpDB.value[name].exp);
                            lastActive = volExpDB.value[name].lastActive;
                        }
                        map.set(name, { name, team, role, exp, lastActive });
                    });

                    for (let name in volExpDB.value) {
                        if (!map.has(name)) {
                            map.set(name, { 
                                name, 
                                team: '历史记录', 
                                role: volExpDB.value[name].role || '未知',
                                exp: volExpDB.value[name].exp, 
                                lastActive: volExpDB.value[name].lastActive 
                            });
                        }
                    }

                    let list = Array.from(map.values());
                    
                    if (dialogFilterTeam.value) list = list.filter(item => item.team === dialogFilterTeam.value);
                    if (dialogFilterRole.value) list = list.filter(item => item.role.includes(dialogFilterRole.value));
                    
                    return list.sort((a, b) => b.exp - a.exp);
                });

                const updateSingleExp = (row) => {
                    if (!volExpDB.value[row.name]) {
                        volExpDB.value[row.name] = { 
                            exp: row.exp, 
                            lastActive: eventDate.value.toISOString().split('T')[0],
                            role: row.role
                        };
                    } else {
                        volExpDB.value[row.name].exp = row.exp;
                        if(row.role && row.role !== '未知') volExpDB.value[row.name].role = row.role;
                    }
                    localStorage.setItem('volExpDB_v10', JSON.stringify(volExpDB.value));
                };

                const setExpLevel = (row, level) => {
                    row.exp = level;
                    updateSingleExp(row);
                    ElementPlus.ElMessage.success(`已将 [${row.name}] 设为 ${level} 次经验`);
                };

                const clearExpDB = () => {
                    if(confirm('🚨 危险操作：确定要清空积累的所有经验数据吗？')){
                        volExpDB.value = {};
                        localStorage.setItem('volExpDB_v10', '{}');
                        ElementPlus.ElMessage.success('本地经验数据库已全部清空');
                    }
                };

                const getCombinedExpObj = (person) => {
                    let localExp = 0;
                    let lastActive = null;
                    if (volExpDB.value[person['姓名']]) {
                        localExp = volExpDB.value[person['姓名']].exp;
                        const ds = volExpDB.value[person['姓名']].lastActive;
                        if(ds && ds !== '-') lastActive = new Date(ds);
                    }
                    let fileExp = parseInt(person['参加次数']) || 0;
                    let finalExp = Math.max(localExp, fileExp);
                    let isDecayed = false;

                    if (lastActive && !isNaN(lastActive) && eventDate.value) {
                        const diffDays = (eventDate.value - lastActive) / (1000 * 60 * 60 * 24);
                        if (diffDays > 180 && finalExp > 0) {
                            finalExp = Math.max(1, Math.floor(finalExp / 2));
                            isDecayed = true;
                        }
                    }
                    return { exp: finalExp, isDecayed };
                };

                const parseDateStr = (str) => {
                    if (!str) return null;
                    const match = str.match(/(\d{4})[-年/.](\d{1,2})[-月/.](\d{1,2})/);
                    if (match) return new Date(match[1], match[2]-1, match[3]);
                    return null;
                };

                const formattedEventDate = computed(() => eventDate.value.toISOString().split('T')[0]);

                const availableTeams = computed(() => {
                    const teams = new Set();
                    blindRunners.value.forEach(r => { if(r['您参加几队活动？']) teams.add(r['您参加几队活动？'].trim()); });
                    volunteers.value.forEach(v => { if(v['您参加几队活动？']) teams.add(v['您参加几队活动？'].trim()); });
                    return Array.from(teams).filter(t => t !== '');
                });

                const filteredVolunteers = computed(() => {
                    if (!selectedTeam.value) return [];
                    return volunteers.value.filter(v => v['您参加几队活动？'] && v['您参加几队活动？'].trim() === selectedTeam.value);
                });

                const isVolunteerAssigned = (n) => currentTeamRunners.value.some(r => r._matchedVolunteer === n);

                const filteredUnassignedVolunteers = computed(() => {
                    return filteredVolunteers.value.filter(v => !isVolunteerAssigned(v['姓名']));
                });

                const getBlindType = (row) => {
                    const role = row['您是盲友还是志愿者？'] || '';
                    if (role.includes('全')) return '全盲';
                    if (role.includes('半')) return '半盲';
                    return '-';
                };

                const getStatusColor = (s) => {
                    if (!s || s === '无记录') return 'info';
                    return s.includes('轻松') ? 'success' : (s.includes('累') ? 'danger' : 'warning');
                };

                const getVolGender = (volName) => {
                    if (!volName) return '';
                    const v = volunteers.value.find(v => v['姓名'] === volName);
                    return v && v['性别'] ? v['性别'] : '';
                };

                // 核心修复：更强悍的年龄解析器，支持科学计数法身份证
                const parseRobustAge = (row) => {
                    if (row['年龄'] && String(row['年龄']).trim() !== '' && String(row['年龄']).trim() !== '0') return String(row['年龄']).trim();
                    let idStr = String(row['身份证号'] || '').replace(/\s+/g, '').toUpperCase();
                    
                    // 处理 Excel 导出时变科学计数法的情况 (如 2.3030319750901574e+17)
                    if (idStr.includes('E+')) {
                        const parts = idStr.split('E+');
                        const numStr = parts[0].replace('.', ''); // 去掉小数点，保留数字，此时年份就在下标 6-9
                        if (numStr.length >= 10) {
                            const birthYear = parseInt(numStr.substring(6, 10));
                            if (!isNaN(birthYear) && birthYear > 1900 && birthYear < 2030) return String(new Date().getFullYear() - birthYear);
                        }
                    } else if (idStr.length === 18) {
                        const birthYear = parseInt(idStr.substring(6, 10));
                        if (!isNaN(birthYear) && birthYear > 1900 && birthYear < 2030) return String(new Date().getFullYear() - birthYear);
                    }
                    return '';
                };

                const initOrUpdateRemark = (runner) => {
                    let remarks = [];
                    if (runner['备注']) remarks.push(`盲友:${runner['备注']}`);
                    const vObj = volunteers.value.find(v => v['姓名'] === runner._matchedVolunteer);
                    if (vObj && vObj['备注']) remarks.push(`志愿:${vObj['备注']}`);
                    runner._customRemark = remarks.join(' | ');
                };

                const handleVolunteerChange = (runner) => initOrUpdateRemark(runner);
                const handleDrop = (e) => { dragOver.value = false; processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => processFiles(e.target.files);

                const processFiles = async (files) => {
                    let rawBlind = new Map();
                    let rawVol = new Map();
                    let latestDate = null;
                    
                    for (const file of files) {
                        const data = await file.arrayBuffer();
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(name => {
                            const sheetData = extractData(workbook.Sheets[name]);
                            sheetData.forEach(row => {
                                const d = parseDateStr(row['报名时间'] || row['日期']);
                                if (d && (!latestDate || d > latestDate)) latestDate = d;

                                const role = row['您是盲友还是志愿者？'] || '';
                                const userName = row['姓名'];
                                if (!userName) return;

                                row['年龄'] = parseRobustAge(row);

                                if (role.includes('盲友')) {
                                    row._matchedVolunteer = '';
                                    row._customRemark = '';
                                    row._label = '';
                                    row._uid = generateUID(); // 加入唯一标识符
                                    rawBlind.set(userName, row);
                                } else if (role.includes('志愿者')) {
                                    row._uid = generateUID();
                                    rawVol.set(userName, row);
                                }
                                
                                if ('体感' in row) statusMap.value[userName] = row['体感'];
                            });
                        });
                    }

                    if (latestDate) eventDate.value = latestDate;

                    blindRunners.value = Array.from(rawBlind.values()).map(r => ({
                        ...r, _status: statusMap.value[r['姓名']] || '无记录'
                    }));
                    volunteers.value = Array.from(rawVol.values());
                    
                    const teams = availableTeams.value;
                    const liuDui = teams.find(t => t.includes('六队'));
                    if (liuDui) selectedTeam.value = liuDui;
                    else if (teams.length === 1) selectedTeam.value = teams[0];
                    else selectedTeam.value = ''; 
                    
                    dataLoaded.value = true;
                };

                const extractData = (ws) => {
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const hIdx = raw.findIndex(r => r && r.some(cell => typeof cell === 'string' && cell.replace(/\s+/g, '') === '姓名'));
                    if (hIdx === -1) return [];
                    const headers = raw[hIdx].map(h => h ? String(h).replace(/\s+/g, '') : `COL_${Math.random()}`);
                    
                    return raw.slice(hIdx + 1).map(r => {
                        let obj = {};
                        headers.forEach((h, i) => { if (r[i] !== undefined) obj[h] = typeof r[i] === 'string' ? r[i].trim() : r[i]; });
                        return obj;
                    }).filter(r => r['姓名']);
                };

                const initSortable = () => {
                    nextTick(() => {
                        const tbody = document.querySelector('.sortable-table .el-table__body-wrapper tbody');
                        if (tbody) {
                            if (window.tableSortable) window.tableSortable.destroy();
                            window.tableSortable = Sortable.create(tbody, {
                                handle: '.drag-handle', animation: 150,
                                onEnd: (evt) => {
                                    const { oldIndex, newIndex } = evt;
                                    const movedItem = currentTeamRunners.value.splice(oldIndex, 1)[0];
                                    currentTeamRunners.value.splice(newIndex, 0, movedItem);
                                    forceUpdateText();
                                }
                            });
                        }
                    });
                };

                watch(selectedTeam, (newTeam) => {
                    if (!newTeam) { currentTeamRunners.value = []; return; }
                    currentTeamRunners.value = blindRunners.value.filter(r => r['您参加几队活动？'] && r['您参加几队活动？'].trim() === newTeam);
                    initSortable();
                });

                const autoPair = () => {
                    let matchCount = 0;
                    currentTeamRunners.value.forEach(r => {
                        if (!r._matchedVolunteer) {
                            const targetGroup = r['您参加快组或者慢组？'];
                            const targetTeam = r['您参加几队活动？'];
                            const targetGender = r['性别'];

                            let candidates = volunteers.value.filter(v => 
                                !isVolunteerAssigned(v['姓名']) && 
                                v['您参加快组或者慢组？'] === targetGroup &&
                                v['您参加几队活动？'] === targetTeam
                            );

                            if (candidates.length > 0) {
                                candidates.sort((a, b) => {
                                    const aGenderMatch = a['性别'] === targetGender ? 1 : 0;
                                    const bGenderMatch = b['性别'] === targetGender ? 1 : 0;
                                    if (aGenderMatch !== bGenderMatch) return bGenderMatch - aGenderMatch; 
                                    return getCombinedExpObj(b).exp - getCombinedExpObj(a).exp;
                                });
                                r._matchedVolunteer = candidates[0]['姓名'];
                                matchCount++;
                            }
                        }
                        initOrUpdateRemark(r);
                    });
                    ElementPlus.ElMessage.success(`预处理完成！自动匹配了 ${matchCount} 对。`);
                };

                // 导出文案更新：将标注放到综合备注的前面
                const generateResultText = () => {
                    if(!selectedTeam.value) return "";
                    let text = `【${selectedTeam.value} 配对结果发布】\n编号\t盲友\t全/半\t志愿者\t标注\t综合备注\n`;
                    currentTeamRunners.value.forEach((r, index) => {
                        const type = getBlindType(r);
                        const label = r._label || '-';
                        const remark = r._customRemark || '-';
                        text += `${index + 1}\t${r['姓名']}\t${type}\t${r._matchedVolunteer || '待定'}\t${label}\t${remark}\n`;
                    });

                    const unassignedNames = filteredUnassignedVolunteers.value.map(v => v['姓名']);
                    if (unassignedNames.length > 0) {
                        text += `\n跟跑：${unassignedNames.join('，')}\n`;
                    }
                    return text;
                };

                const forceUpdateText = () => {
                    publishText.value = generateResultText();
                    ElementPlus.ElMessage.success('已应用排版顺序');
                };

                watch(() => [currentTeamRunners.value, volunteers.value, selectedTeam.value], () => {
                    if (!isTextFocused.value) publishText.value = generateResultText();
                }, { deep: true });

                const copyToClipboard = () => {
                    navigator.clipboard.writeText(publishText.value);
                    const todayStr = formattedEventDate.value;
                    let dbUpdated = false;
                    
                    currentTeamRunners.value.forEach(r => {
                        const rName = r['姓名'];
                        if (rName) {
                            if (!volExpDB.value[rName]) {
                                volExpDB.value[rName] = { exp: parseInt(r['参加次数']) || 0, lastActive: '', role: '盲友' };
                            }
                            if (volExpDB.value[rName].lastActive !== todayStr) {
                                volExpDB.value[rName].exp += 1;
                                volExpDB.value[rName].lastActive = todayStr;
                                volExpDB.value[rName].role = '盲友';
                                dbUpdated = true;
                            }
                        }
                        
                        const vName = r._matchedVolunteer;
                        if (vName) {
                            if (!volExpDB.value[vName]) {
                                volExpDB.value[vName] = { exp: parseInt(volunteers.value.find(v=>v['姓名']===vName)?.['参加次数']) || 0, lastActive: '', role: '志愿者' };
                            }
                            if (volExpDB.value[vName].lastActive !== todayStr) {
                                volExpDB.value[vName].exp += 1;
                                volExpDB.value[vName].lastActive = todayStr;
                                volExpDB.value[vName].role = '志愿者';
                                dbUpdated = true;
                            }
                        }
                    });
                    
                    if (dbUpdated) localStorage.setItem('volExpDB_v10', JSON.stringify(volExpDB.value));
                    
                    ElementPlus.ElMessage.success('已复制发布文案！本日配对的所有盲友与志愿者经验均已+1自动打卡。');
                };

                const resetData = () => { 
                    dataLoaded.value = false; selectedTeam.value = ''; blindRunners.value = []; 
                    volunteers.value = []; currentTeamRunners.value = []; statusMap.value = {}; publishText.value = "";
                };

                return { 
                    dragOver, dataLoaded, expDialogVisible, blindRunners, volunteers, currentTeamRunners,
                    selectedTeam, availableTeams, filteredVolunteers, filteredUnassignedVolunteers, 
                    publishText, isTextFocused, formattedEventDate, expDbList,
                    dialogFilterTeam, dialogFilterRole,
                    handleDrop, handleFileUpload, handleVolunteerChange,
                    getBlindType, getStatusColor, isVolunteerAssigned, getVolGender, getCombinedExpObj,
                    updateSingleExp, setExpLevel, clearExpDB,
                    generateResultText, copyToClipboard, resetData, autoPair, forceUpdateText
                };
            }
        });

        for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
        app.use(ElementPlus).mount('#app');
    </script>
</body>
</html>
