<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助盲团智能配对系统 v7.0</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://unpkg.com/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-title {
            font-weight: 300;
            letter-spacing: 2px;
            color: #2c3e50;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .upload-area {
            display: block;
            text-align: center;
            padding: 60px 20px;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        .upload-area:hover, .upload-area.is-dragover {
            border-color: #409EFF;
            background-color: #ecf5ff;
        }
        .section-title {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 4px solid #409EFF;
        }
        .el-textarea__inner {
            font-family: "PingFang SC", "Microsoft YaHei", monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            background-color: #fafafa !important;
        }
        .team-filter-bar {
            background: #ecf5ff;
            border: 1px solid #d9ecff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px dashed #e4e7ed;
        }
        /* 拖拽手柄样式 */
        .drag-handle {
            cursor: grab;
            font-size: 18px;
            color: #909399;
            transition: color 0.2s;
        }
        .drag-handle:hover {
            color: #409EFF;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        /* 被拖拽行高亮 */
        .sortable-ghost {
            opacity: 0.8;
            background-color: #ecf5ff !important;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 class="header-title">🏔️ 助盲团智能配对系统 <el-tag type="warning" effect="plain" round>v7.0 拖拽排序+经验记忆版</el-tag></h1>
            
            <div v-if="!dataLoaded">
                <label class="upload-area" 
                       :class="{ 'is-dragover': dragOver }"
                       @dragover.prevent="dragOver = true"
                       @dragleave.prevent="dragOver = false"
                       @drop.prevent="handleDrop"
                       for="fileInput">
                    <input type="file" id="fileInput" @change="handleFileUpload" accept=".xlsx, .xls, .csv" multiple style="display: none" />
                    <el-icon :size="50" color="#909399"><upload-filled /></el-icon>
                    <h3 style="font-weight: 400; color: #303133; margin-top: 20px;">拖拽完整的报名表及状态表至此处</h3>
                    <p style="color: #909399; font-size: 14px;">自动识别性别并优先经验配对</p>
                </label>
            </div>

            <div v-else>
                <div class="team-filter-bar">
                    <span style="margin-right: 15px; font-weight: bold; color: #409EFF;">📍 队伍工作区：</span>
                    <el-select v-model="selectedTeam" placeholder="请选择要处理的队伍" clearable style="width: 250px;">
                        <el-option v-for="team in availableTeams" :key="team" :label="team" :value="team"></el-option>
                    </el-select>
                    <span style="margin-left: 20px; font-size: 13px; color: #606266;">
                        所有人员、闲置池和发布文案均随队伍切换而自动隔离。
                    </span>
                    <div style="flex-grow: 1; text-align: right;">
                        <el-button plain size="small" @click="resetData">重新导入</el-button>
                    </div>
                </div>

                <div v-if="selectedTeam">
                    <el-row justify="space-between" align="middle" style="margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; display: inline-block; margin-right: 15px;">
                                【{{ selectedTeam }}】配对台
                            </h2>
                            <el-tag type="info">当前视图盲友: {{ currentTeamRunners.length }} 人</el-tag>
                        </div>
                        <div>
                            <el-button type="primary" plain @click="autoPair">智能预配对 (同性+老兵优先)</el-button>
                        </div>
                    </el-row>

                    <el-table :data="currentTeamRunners" style="width: 100%" stripe border class="sortable-table" row-key="姓名">
                        <el-table-column width="40" align="center">
                            <template #default="scope">
                                <el-icon class="drag-handle"><Rank /></el-icon>
                            </template>
                        </el-table-column>
                        
                        <el-table-column prop="姓名" label="盲友" width="90"></el-table-column>
                        <el-table-column prop="性别" label="盲友性别" width="80" align="center"></el-table-column>
                        <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                        
                        <el-table-column label="近期状态" width="100" align="center">
                            <template #default="scope">
                                <el-tag :type="getStatusColor(scope.row._status)" size="small" effect="light">
                                    {{ scope.row._status || '无记录' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                        
                        <el-table-column label="志愿者配对 (当前队伍内)">
                            <template #default="scope">
                                <el-select 
                                    v-model="scope.row._matchedVolunteer" 
                                    filterable 
                                    clearable 
                                    placeholder="选择志愿者"
                                    @change="handleVolunteerChange(scope.row)"
                                    style="width: 100%;">
                                    <el-option
                                        v-for="vol in filteredVolunteers"
                                        :key="vol['姓名']"
                                        :label="vol['姓名']"
                                        :value="vol['姓名']"
                                        :disabled="isVolunteerAssigned(vol['姓名']) && scope.row._matchedVolunteer !== vol['姓名']">
                                        <span style="float: left"><strong>{{ vol['姓名'] }}</strong> ({{ vol['年龄'] || '?' }}岁)</span>
                                        <span style="float: right; color: #8492a6; font-size: 12px">
                                            {{ vol['您参加快组或者慢组？'] }} | {{ vol['性别'] }} | 经验:{{ getCombinedExp(vol) }}次
                                        </span>
                                    </el-option>
                                </el-select>
                            </template>
                        </el-table-column>
                        
                        <el-table-column label="志愿性别" width="90" align="center">
                            <template #default="scope">
                                <span v-if="getVolGender(scope.row._matchedVolunteer)" 
                                      :style="{ 
                                        fontWeight: 'bold',
                                        color: getVolGender(scope.row._matchedVolunteer) === scope.row['性别'] ? '#67C23A' : '#E6A23C' 
                                      }">
                                    {{ getVolGender(scope.row._matchedVolunteer) }}
                                    <span v-if="getVolGender(scope.row._matchedVolunteer) !== scope.row['性别']" style="font-size:12px;">(异性)</span>
                                </span>
                                <span v-else style="color:#ccc">-</span>
                            </template>
                        </el-table-column>

                        <el-table-column label="综合备注 (可直接点击编辑)" min-width="180">
                            <template #default="scope">
                                <el-input 
                                    v-model="scope.row._customRemark" 
                                    placeholder="可输入自定义备注" 
                                    size="small" 
                                    clearable>
                                </el-input>
                            </template>
                        </el-table-column>
                    </el-table>

                    <div v-if="filteredUnassignedVolunteers.length > 0 || filteredUnassignedRunners.length > 0">
                        <h3 class="section-title">闲置人员池 (未匹配成功)</h3>
                        <el-row :gutter="20">
                            <el-col :span="12" v-if="filteredUnassignedVolunteers.length > 0">
                                <el-table :data="filteredUnassignedVolunteers" style="width: 100%" size="small" border stripe>
                                    <el-table-column prop="姓名" label="未分配志愿者" width="100"></el-table-column>
                                    <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                                    <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                                    <el-table-column label="经验" width="60" align="center">
                                        <template #default="scope">{{ getCombinedExp(scope.row) }}次</template>
                                    </el-table-column>
                                    <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                </el-table>
                            </el-col>
                            <el-col :span="12" v-if="filteredUnassignedRunners.length > 0">
                                <el-table :data="filteredUnassignedRunners" style="width: 100%" size="small" border stripe>
                                    <el-table-column prop="姓名" label="待分配盲友" width="100"></el-table-column>
                                    <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                                    <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                                    <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                </el-table>
                            </el-col>
                        </el-row>
                    </div>

                    <div style="margin-top: 40px; border-top: 1px solid #eaeaea; padding-top: 20px;">
                        <el-row justify="space-between" align="middle" style="margin-bottom: 10px;">
                            <h2>微信发布格式预览 (无需性别信息)</h2>
                            <div>
                                <el-button plain @click="forceUpdateText" size="small">🔄 刷新拖拽后排版</el-button>
                                <el-button type="primary" @click="copyToClipboard">一键复制并累加经验记录</el-button>
                            </div>
                        </el-row>
                        
                        <el-input
                            type="textarea"
                            v-model="publishText"
                            :rows="12"
                            @focus="isTextFocused = true"
                            @blur="isTextFocused = false"
                            placeholder="配对完成后，发布文案会自动生成在这里...">
                        </el-input>
                    </div>
                </div>
                
                <div v-else class="empty-state">
                    <el-icon :size="60" color="#c0c4cc"><DataBoard /></el-icon>
                    <h2 style="color: #606266; margin-top: 20px; font-weight: 400;">数据导入成功！共提取到 {{ availableTeams.length }} 个队伍</h2>
                    <p style="color: #909399; font-size: 16px;">☝️ 请在上方下拉菜单中，选择您要处理的具体队伍</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch, nextTick } = Vue;

        const app = createApp({
            setup() {
                const dragOver = ref(false);
                const dataLoaded = ref(false);
                
                const blindRunners = ref([]);
                const volunteers = ref([]);
                const statusMap = ref({});
                
                const selectedTeam = ref('');
                // 使用实际的数组响应拖拽，不再纯粹依赖 computed
                const currentTeamRunners = ref([]); 
                
                const publishText = ref("");
                const isTextFocused = ref(false);

                // --- 经验记忆数据库 (localStorage) ---
                // 格式: { "张三": { "2024-04-25": true, "2024-04-26": true } }
                const volExpDB = ref(JSON.parse(localStorage.getItem('volParticipations') || '{}'));

                // 获取某个志愿者的最高经验（表里带的次数 vs 本地记录的次数）
                const getCombinedExp = (vol) => {
                    const localExp = Object.keys(volExpDB.value[vol['姓名']] || {}).length;
                    const fileExp = parseInt(vol['参加次数']) || 0;
                    return Math.max(localExp, fileExp);
                };

                // 当点击复制时，为本次成功配对的志愿者打卡记录
                const recordParticipation = () => {
                    const todayDate = new Date().toLocaleDateString();
                    let updated = false;
                    currentTeamRunners.value.forEach(r => {
                        if (r._matchedVolunteer) {
                            if (!volExpDB.value[r._matchedVolunteer]) {
                                volExpDB.value[r._matchedVolunteer] = {};
                            }
                            // 如果今天还没记录过，则记一次（防止重复点复制导致暴增）
                            if (!volExpDB.value[r._matchedVolunteer][todayDate]) {
                                volExpDB.value[r._matchedVolunteer][todayDate] = true;
                                updated = true;
                            }
                        }
                    });
                    if (updated) {
                        localStorage.setItem('volParticipations', JSON.stringify(volExpDB.value));
                    }
                };

                // --- 基础业务逻辑 ---
                const availableTeams = computed(() => {
                    const teams = new Set();
                    blindRunners.value.forEach(r => { if(r['您参加几队活动？']) teams.add(r['您参加几队活动？'].trim()); });
                    volunteers.value.forEach(v => { if(v['您参加几队活动？']) teams.add(v['您参加几队活动？'].trim()); });
                    return Array.from(teams).filter(t => t !== '');
                });

                const filteredVolunteers = computed(() => {
                    if (!selectedTeam.value) return [];
                    return volunteers.value.filter(v => v['您参加几队活动？'] && v['您参加几队活动？'].trim() === selectedTeam.value);
                });

                // 判断志愿者是否已被占用
                const isVolunteerAssigned = (n) => currentTeamRunners.value.some(r => r._matchedVolunteer === n);

                const filteredUnassignedVolunteers = computed(() => {
                    return filteredVolunteers.value.filter(v => !isVolunteerAssigned(v['姓名']));
                });
                const filteredUnassignedRunners = computed(() => {
                    return currentTeamRunners.value.filter(r => !r._matchedVolunteer);
                });

                const getStatusColor = (s) => {
                    if (!s || s === '无记录') return 'info';
                    return s.includes('轻松') ? 'success' : (s.includes('累') ? 'danger' : 'warning');
                };

                const getVolAge = (volName) => {
                    if (!volName) return '';
                    const v = volunteers.value.find(v => v['姓名'] === volName);
                    return v && v['年龄'] ? v['年龄'] : '';
                };

                // 新增：获取志愿者性别
                const getVolGender = (volName) => {
                    if (!volName) return '';
                    const v = volunteers.value.find(v => v['姓名'] === volName);
                    return v && v['性别'] ? v['性别'] : '';
                };

                const parseRobustAge = (row) => {
                    if (row['年龄'] && String(row['年龄']).trim() !== '' && String(row['年龄']).trim() !== '0') {
                        return String(row['年龄']).trim();
                    }
                    let idStr = row['身份证号'] ? String(row['身份证号']).replace(/\s+/g, '') : '';
                    if (idStr.length > 6 && idStr.length === 18) {
                        const birthYear = parseInt(idStr.substring(6, 10));
                        if (!isNaN(birthYear) && birthYear > 1900 && birthYear < 2030) {
                            return String(new Date().getFullYear() - birthYear);
                        }
                    }
                    return '';
                };

                const initOrUpdateRemark = (runner) => {
                    let remarks = [];
                    if (runner['备注']) remarks.push(`盲友:${runner['备注']}`);
                    const vObj = volunteers.value.find(v => v['姓名'] === runner._matchedVolunteer);
                    if (vObj && vObj['备注']) remarks.push(`志愿:${vObj['备注']}`);
                    runner._customRemark = remarks.join(' | ');
                };

                const handleVolunteerChange = (runner) => initOrUpdateRemark(runner);
                const handleDrop = (e) => { dragOver.value = false; processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => processFiles(e.target.files);

                // --- SortableJS 拖拽初始化 ---
                const initSortable = () => {
                    nextTick(() => {
                        const tbody = document.querySelector('.sortable-table .el-table__body-wrapper tbody');
                        if (tbody) {
                            if (window.tableSortable) window.tableSortable.destroy();
                            window.tableSortable = Sortable.create(tbody, {
                                handle: '.drag-handle', // 绑定在手柄图标上
                                animation: 150,
                                onEnd: (evt) => {
                                    const { oldIndex, newIndex } = evt;
                                    // 真实移动数据数组位置
                                    const movedItem = currentTeamRunners.value.splice(oldIndex, 1)[0];
                                    currentTeamRunners.value.splice(newIndex, 0, movedItem);
                                    forceUpdateText(); // 拖拽完自动刷新下方文案
                                }
                            });
                        }
                    });
                };

                // 监听队伍选择，抽取出当前队伍的独立操作数组，并重新挂载拖拽
                watch(selectedTeam, (newTeam) => {
                    if (!newTeam) {
                        currentTeamRunners.value = [];
                        return;
                    }
                    // 抽出当前队伍的盲友作为本视图的主体
                    currentTeamRunners.value = blindRunners.value.filter(r => r['您参加几队活动？'] && r['您参加几队活动？'].trim() === newTeam);
                    initSortable();
                });

                // --- 智能预配对核心逻辑 (含性别/经验双权重) ---
                const autoPair = () => {
                    let matchCount = 0;
                    currentTeamRunners.value.forEach(r => {
                        if (!r._matchedVolunteer) {
                            const targetGroup = r['您参加快组或者慢组？'];
                            const targetTeam = r['您参加几队活动？'];
                            const targetGender = r['性别'];

                            // 第一步：找队伍和快慢组一致的闲置人员
                            let candidates = volunteers.value.filter(v => 
                                !isVolunteerAssigned(v['姓名']) && 
                                v['您参加快组或者慢组？'] === targetGroup &&
                                v['您参加几队活动？'] === targetTeam
                            );

                            if (candidates.length > 0) {
                                // 第二步：排序机制（同性优先 > 经验高优先）
                                candidates.sort((a, b) => {
                                    const aGenderMatch = a['性别'] === targetGender ? 1 : 0;
                                    const bGenderMatch = b['性别'] === targetGender ? 1 : 0;
                                    
                                    // 如果性别匹配情况不同，优先同性
                                    if (aGenderMatch !== bGenderMatch) {
                                        return bGenderMatch - aGenderMatch; 
                                    }
                                    
                                    // 如果性别一样，优先经验值高的老手
                                    return getCombinedExp(b) - getCombinedExp(a);
                                });

                                // 取排第一的候选人
                                r._matchedVolunteer = candidates[0]['姓名'];
                                matchCount++;
                            }
                        }
                        initOrUpdateRemark(r);
                    });
                    ElementPlus.ElMessage.success(`预处理完成！自动匹配了 ${matchCount} 对 (优先同性别，优先老带新)。`);
                };

                const processFiles = async (files) => {
                    let rawBlind = new Map();
                    let rawVol = new Map();
                    
                    for (const file of files) {
                        const data = await file.arrayBuffer();
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(name => {
                            const sheetData = extractData(workbook.Sheets[name]);
                            sheetData.forEach(row => {
                                const role = row['您是盲友还是志愿者？'] || '';
                                const userName = row['姓名'];
                                if (!userName) return;

                                row['年龄'] = parseRobustAge(row);

                                if (role.includes('盲友')) {
                                    row._matchedVolunteer = '';
                                    row._customRemark = '';
                                    rawBlind.set(userName, row);
                                } else if (role.includes('志愿者')) {
                                    rawVol.set(userName, row);
                                }
                                
                                if ('体感' in row) statusMap.value[userName] = row['体感'];
                            });
                        });
                    }

                    blindRunners.value = Array.from(rawBlind.values()).map(r => ({
                        ...r,
                        _status: statusMap.value[r['姓名']] || '无记录'
                    }));
                    volunteers.value = Array.from(rawVol.values());
                    
                    // 默认选六队
                    const teams = availableTeams.value;
                    const liuDui = teams.find(t => t.includes('六队'));
                    if (liuDui) selectedTeam.value = liuDui;
                    else if (teams.length === 1) selectedTeam.value = teams[0];
                    else selectedTeam.value = ''; 
                    
                    dataLoaded.value = true;
                };

                const extractData = (ws) => {
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const hIdx = raw.findIndex(r => r && r.some(cell => 
                        typeof cell === 'string' && cell.replace(/\s+/g, '') === '姓名'
                    ));
                    if (hIdx === -1) return [];
                    const headers = raw[hIdx].map(h => h ? String(h).replace(/\s+/g, '') : `COL_${Math.random()}`);
                    
                    return raw.slice(hIdx + 1).map(r => {
                        let obj = {};
                        headers.forEach((h, i) => {
                            if (r[i] !== undefined) obj[h] = typeof r[i] === 'string' ? r[i].trim() : r[i];
                        });
                        return obj;
                    }).filter(r => r['姓名']);
                };

                // --- 最终输出文案 ---
                const generateResultText = () => {
                    if(!selectedTeam.value) return "";
                    let text = `【${selectedTeam.value} 配对结果发布】\n盲友\t全/半\t志愿者\t综合备注\n`;
                    // 这里遍历的是 currentTeamRunners，确保完全按照拖拽后的顺序输出！
                    currentTeamRunners.value.forEach(r => {
                        const type = (r['您是盲友还是志愿者？'] || '').includes('全') ? '全' : '半';
                        const remark = r._customRemark || '-';
                        text += `${r['姓名']}\t${type}\t${r._matchedVolunteer || '待定'}\t${remark}\n`;
                    });

                    const unassignedNames = filteredUnassignedVolunteers.value.map(v => v['姓名']);
                    if (unassignedNames.length > 0) {
                        text += `\n跟跑：${unassignedNames.join('，')}\n`;
                    }
                    return text;
                };

                const forceUpdateText = () => {
                    publishText.value = generateResultText();
                    ElementPlus.ElMessage.success('已应用拖拽后的新排版');
                };

                watch(() => [currentTeamRunners.value, volunteers.value, selectedTeam.value], () => {
                    if (!isTextFocused.value) publishText.value = generateResultText();
                }, { deep: true });

                const copyToClipboard = () => {
                    navigator.clipboard.writeText(publishText.value);
                    // 点击复制时，记录本次人员的经验
                    recordParticipation();
                    ElementPlus.ElMessage.success('已复制发布文案！同时为您记录了本次志愿者服务的档案。');
                };

                const resetData = () => { 
                    dataLoaded.value = false; 
                    selectedTeam.value = '';
                    blindRunners.value = []; 
                    volunteers.value = []; 
                    currentTeamRunners.value = [];
                    statusMap.value = {}; 
                    publishText.value = "";
                };

                return { 
                    dragOver, dataLoaded, blindRunners, volunteers, currentTeamRunners,
                    selectedTeam, availableTeams, filteredVolunteers,
                    filteredUnassignedVolunteers, filteredUnassignedRunners, 
                    publishText, isTextFocused,
                    handleDrop, handleFileUpload, handleVolunteerChange,
                    getStatusColor, isVolunteerAssigned, getVolAge, getVolGender, getCombinedExp,
                    generateResultText, copyToClipboard, resetData, autoPair, forceUpdateText
                };
            }
        });

        for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
        app.use(ElementPlus).mount('#app');
    </script>
</body>
</html>
