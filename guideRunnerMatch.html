<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助盲团智能配对系统 v6.0</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-title {
            font-weight: 300;
            letter-spacing: 2px;
            color: #2c3e50;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .upload-area {
            display: block;
            text-align: center;
            padding: 60px 20px;
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }
        .upload-area:hover, .upload-area.is-dragover {
            border-color: #409EFF;
            background-color: #ecf5ff;
        }
        .section-title {
            margin: 30px 0 15px 0;
            padding-left: 10px;
            border-left: 4px solid #409EFF;
        }
        .el-textarea__inner {
            font-family: "PingFang SC", "Microsoft YaHei", monospace !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            background-color: #fafafa !important;
        }
        .team-filter-bar {
            background: #ecf5ff;
            border: 1px solid #d9ecff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px dashed #e4e7ed;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 class="header-title">🏔️ 助盲团智能配对系统</h1>
            
            <div v-if="!dataLoaded">
                <label class="upload-area" 
                       :class="{ 'is-dragover': dragOver }"
                       @dragover.prevent="dragOver = true"
                       @dragleave.prevent="dragOver = false"
                       @drop.prevent="handleDrop"
                       for="fileInput">
                    <input type="file" id="fileInput" @change="handleFileUpload" accept=".xlsx, .xls, .csv" multiple style="display: none" />
                    <el-icon :size="50" color="#909399"><upload-filled /></el-icon>
                    <h3 style="font-weight: 400; color: #303133; margin-top: 20px;">拖拽完整的报名表及状态表至此处</h3>
                    <p style="color: #909399; font-size: 14px;">自动识别队伍边界并过滤数据</p>
                </label>
            </div>

            <div v-else>
                <div class="team-filter-bar">
                    <span style="margin-right: 15px; font-weight: bold; color: #409EFF;">📍 队伍工作区：</span>
                    <el-select v-model="selectedTeam" placeholder="请选择要处理的队伍" clearable style="width: 250px;">
                        <el-option v-for="team in availableTeams" :key="team" :label="team" :value="team"></el-option>
                    </el-select>
                    <span style="margin-left: 20px; font-size: 13px; color: #606266;">
                        所有人员、闲置池和发布文案均随队伍切换而自动隔离。
                    </span>
                    <div style="flex-grow: 1; text-align: right;">
                        <el-button plain size="small" @click="resetData">重新导入数据</el-button>
                    </div>
                </div>

                <div v-if="selectedTeam">
                    <el-row justify="space-between" align="middle" style="margin-bottom: 20px;">
                        <div>
                            <h2 style="margin: 0; display: inline-block; margin-right: 15px;">
                                【{{ selectedTeam }}】配对台
                            </h2>
                            <el-tag type="info">当前视图盲友: {{ filteredBlindRunners.length }} 人</el-tag>
                        </div>
                        <div>
                            <el-button type="primary" plain @click="autoPair">一键智能预配对</el-button>
                        </div>
                    </el-row>

                    <el-table :data="filteredBlindRunners" style="width: 100%" stripe border>
                        <el-table-column prop="姓名" label="盲友" width="90" fixed></el-table-column>
                        <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                        <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                        
                        <el-table-column label="近期状态" width="100" align="center">
                            <template #default="scope">
                                <el-tag :type="getStatusColor(scope.row._status)" size="small" effect="light">
                                    {{ scope.row._status || '无记录' }}
                                </el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                        
                        <el-table-column label="志愿者配对 (当前队伍内)">
                            <template #default="scope">
                                <el-select 
                                    v-model="scope.row._matchedVolunteer" 
                                    filterable 
                                    clearable 
                                    placeholder="选择志愿者"
                                    @change="handleVolunteerChange(scope.row)"
                                    style="width: 100%;">
                                    <el-option
                                        v-for="vol in filteredVolunteers"
                                        :key="vol['姓名']"
                                        :label="vol['姓名']"
                                        :value="vol['姓名']"
                                        :disabled="isVolunteerAssigned(vol['姓名']) && scope.row._matchedVolunteer !== vol['姓名']">
                                        <span style="float: left"><strong>{{ vol['姓名'] }}</strong> ({{ vol['年龄'] || '?' }}岁)</span>
                                        <span style="float: right; color: #8492a6; font-size: 12px">
                                            {{ vol['您参加快组或者慢组？'] }} | {{ vol['性别'] }}
                                        </span>
                                    </el-option>
                                </el-select>
                            </template>
                        </el-table-column>
                        
                        <el-table-column label="志愿年龄" width="80" align="center">
                            <template #default="scope">
                                <span :style="{ color: getVolAge(scope.row._matchedVolunteer) ? '#333' : '#ccc' }">
                                    {{ getVolAge(scope.row._matchedVolunteer) || '-' }}
                                </span>
                            </template>
                        </el-table-column>

                        <el-table-column label="综合备注 (可直接点击编辑)" min-width="180">
                            <template #default="scope">
                                <el-input 
                                    v-model="scope.row._customRemark" 
                                    placeholder="可输入自定义备注" 
                                    size="small" 
                                    clearable>
                                </el-input>
                            </template>
                        </el-table-column>
                    </el-table>

                    <div v-if="filteredUnassignedVolunteers.length > 0 || filteredUnassignedRunners.length > 0">
                        <h3 class="section-title">当前队伍闲置人员池</h3>
                        <el-row :gutter="20">
                            <el-col :span="12" v-if="filteredUnassignedVolunteers.length > 0">
                                <el-table :data="filteredUnassignedVolunteers" style="width: 100%" size="small" border stripe>
                                    <el-table-column prop="姓名" label="未分配志愿者" width="100"></el-table-column>
                                    <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                                    <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                                    <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                    <el-table-column prop="备注" label="原始备注" show-overflow-tooltip></el-table-column>
                                </el-table>
                            </el-col>
                            <el-col :span="12" v-if="filteredUnassignedRunners.length > 0">
                                <el-table :data="filteredUnassignedRunners" style="width: 100%" size="small" border stripe>
                                    <el-table-column prop="姓名" label="待分配盲友" width="100"></el-table-column>
                                    <el-table-column prop="性别" label="性别" width="60" align="center"></el-table-column>
                                    <el-table-column prop="年龄" label="年龄" width="60" align="center"></el-table-column>
                                    <el-table-column prop="您参加快组或者慢组？" label="意向" width="70"></el-table-column>
                                    <el-table-column prop="备注" label="原始备注" show-overflow-tooltip></el-table-column>
                                </el-table>
                            </el-col>
                        </el-row>
                    </div>

                    <div style="margin-top: 40px; border-top: 1px solid #eaeaea; padding-top: 20px;">
                        <el-row justify="space-between" align="middle" style="margin-bottom: 10px;">
                            <h2>微信发布格式预览 (无需性别信息)</h2>
                            <div>
                                <el-button plain @click="forceUpdateText" size="small">🔄 还原系统默认格式</el-button>
                                <el-button type="primary" @click="copyToClipboard">一键复制发布内容</el-button>
                            </div>
                        </el-row>
                        
                        <el-input
                            type="textarea"
                            v-model="publishText"
                            :rows="12"
                            @focus="isTextFocused = true"
                            @blur="isTextFocused = false"
                            placeholder="配对完成后，发布文案会自动生成在这里...">
                        </el-input>
                    </div>
                </div>
                
                <div v-else class="empty-state">
                    <el-icon :size="60" color="#c0c4cc"><DataBoard /></el-icon>
                    <h2 style="color: #606266; margin-top: 20px; font-weight: 400;">数据导入成功！共提取到 {{ availableTeams.length }} 个队伍</h2>
                    <p style="color: #909399; font-size: 16px;">☝️ 请在上方下拉菜单中，选择您要处理的具体队伍</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;

        const app = createApp({
            setup() {
                const dragOver = ref(false);
                const dataLoaded = ref(false);
                
                const blindRunners = ref([]);
                const volunteers = ref([]);
                const statusMap = ref({});
                
                const selectedTeam = ref('');
                const publishText = ref("");
                const isTextFocused = ref(false);

                // --- 自动提取队伍并过滤 ---
                const availableTeams = computed(() => {
                    const teams = new Set();
                    blindRunners.value.forEach(r => { if(r['您参加几队活动？']) teams.add(r['您参加几队活动？'].trim()); });
                    volunteers.value.forEach(v => { if(v['您参加几队活动？']) teams.add(v['您参加几队活动？'].trim()); });
                    return Array.from(teams).filter(t => t !== '');
                });

                const filteredBlindRunners = computed(() => {
                    if (!selectedTeam.value) return [];
                    return blindRunners.value.filter(r => r['您参加几队活动？'] && r['您参加几队活动？'].trim() === selectedTeam.value);
                });

                const filteredVolunteers = computed(() => {
                    if (!selectedTeam.value) return [];
                    return volunteers.value.filter(v => v['您参加几队活动？'] && v['您参加几队活动？'].trim() === selectedTeam.value);
                });

                const isVolunteerAssigned = (n) => blindRunners.value.some(r => r._matchedVolunteer === n);

                const filteredUnassignedVolunteers = computed(() => {
                    return filteredVolunteers.value.filter(v => !isVolunteerAssigned(v['姓名']));
                });
                const filteredUnassignedRunners = computed(() => {
                    return filteredBlindRunners.value.filter(r => !r._matchedVolunteer);
                });

                // --- 基础业务逻辑 ---
                const getStatusColor = (s) => {
                    if (!s || s === '无记录') return 'info';
                    return s.includes('轻松') ? 'success' : (s.includes('累') ? 'danger' : 'warning');
                };

                const getVolAge = (volName) => {
                    if (!volName) return '';
                    const v = volunteers.value.find(v => v['姓名'] === volName);
                    return v && v['年龄'] ? v['年龄'] : '';
                };

                const parseRobustAge = (row) => {
                    if (row['年龄'] && String(row['年龄']).trim() !== '' && String(row['年龄']).trim() !== '0') {
                        return String(row['年龄']).trim();
                    }
                    let idStr = row['身份证号'] ? String(row['身份证号']).replace(/\s+/g, '') : '';
                    if (idStr.length > 6 && idStr.length === 18) {
                        const birthYear = parseInt(idStr.substring(6, 10));
                        if (!isNaN(birthYear) && birthYear > 1900 && birthYear < 2030) {
                            return String(new Date().getFullYear() - birthYear);
                        }
                    }
                    return '';
                };

                const initOrUpdateRemark = (runner) => {
                    let remarks = [];
                    if (runner['备注']) remarks.push(`盲友:${runner['备注']}`);
                    const vObj = volunteers.value.find(v => v['姓名'] === runner._matchedVolunteer);
                    if (vObj && vObj['备注']) remarks.push(`志愿:${vObj['备注']}`);
                    runner._customRemark = remarks.join(' | ');
                };

                const handleVolunteerChange = (runner) => initOrUpdateRemark(runner);
                const handleDrop = (e) => { dragOver.value = false; processFiles(e.dataTransfer.files); };
                const handleFileUpload = (e) => processFiles(e.target.files);

                // --- 文件解析 ---
                const processFiles = async (files) => {
                    let rawBlind = new Map();
                    let rawVol = new Map();
                    
                    for (const file of files) {
                        const data = await file.arrayBuffer();
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(name => {
                            const sheetData = extractData(workbook.Sheets[name]);
                            sheetData.forEach(row => {
                                const role = row['您是盲友还是志愿者？'] || '';
                                const userName = row['姓名'];
                                if (!userName) return;

                                row['年龄'] = parseRobustAge(row);

                                if (role.includes('盲友')) {
                                    row._matchedVolunteer = '';
                                    row._customRemark = '';
                                    rawBlind.set(userName, row);
                                } else if (role.includes('志愿者')) {
                                    rawVol.set(userName, row);
                                }
                                
                                if ('体感' in row) statusMap.value[userName] = row['体感'];
                            });
                        });
                    }

                    blindRunners.value = Array.from(rawBlind.values()).map(r => ({
                        ...r,
                        _status: statusMap.value[r['姓名']] || '无记录'
                    }));
                    volunteers.value = Array.from(rawVol.values());
                    
                    // 智能默认聚焦逻辑：优先寻找六队
                    const teams = availableTeams.value;
                    const liuDui = teams.find(t => t.includes('六队'));
                    if (liuDui) {
                        selectedTeam.value = liuDui;
                    } else if (teams.length === 1) {
                        selectedTeam.value = teams[0];
                    } else {
                        selectedTeam.value = ''; // 没有明确优先队伍时，保持留白待机画面
                    }
                    
                    dataLoaded.value = true;
                };

                const extractData = (ws) => {
                    const raw = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const hIdx = raw.findIndex(r => r && r.some(cell => 
                        typeof cell === 'string' && cell.replace(/\s+/g, '') === '姓名'
                    ));
                    if (hIdx === -1) return [];
                    const headers = raw[hIdx].map(h => h ? String(h).replace(/\s+/g, '') : `COL_${Math.random()}`);
                    
                    return raw.slice(hIdx + 1).map(r => {
                        let obj = {};
                        headers.forEach((h, i) => {
                            if (r[i] !== undefined) {
                                obj[h] = typeof r[i] === 'string' ? r[i].trim() : r[i];
                            }
                        });
                        return obj;
                    }).filter(r => r['姓名']);
                };

                const autoPair = () => {
                    let matchCount = 0;
                    filteredBlindRunners.value.forEach(r => {
                        if (!r._matchedVolunteer) {
                            const v = filteredVolunteers.value.find(v => 
                                !isVolunteerAssigned(v['姓名']) && 
                                v['您参加快组或者慢组？'] === r['您参加快组或者慢组？'] &&
                                v['您参加几队活动？'] === r['您参加几队活动？']
                            );
                            if (v) {
                                r._matchedVolunteer = v['姓名'];
                                matchCount++;
                            }
                        }
                        initOrUpdateRemark(r);
                    });
                    ElementPlus.ElMessage.success(`预处理完成！在当前视图下自动匹配了 ${matchCount} 对。`);
                };

                // --- 最终输出（保持不变：不携带性别） ---
                const generateResultText = () => {
                    if(!selectedTeam.value) return "";
                    let text = `【${selectedTeam.value}配对结果发布】\n盲友\t全/半\t志愿者\t综合备注\n`;
                    filteredBlindRunners.value.forEach(r => {
                        const type = (r['您是盲友还是志愿者？'] || '').includes('全') ? '全' : '半';
                        const remark = r._customRemark || '-';
                        text += `${r['姓名']}\t${type}\t${r._matchedVolunteer || '待定'}\t${remark}\n`;
                    });

                    const unassignedNames = filteredUnassignedVolunteers.value.map(v => v['姓名']);
                    if (unassignedNames.length > 0) {
                        text += `\n跟跑：${unassignedNames.join('，')}\n`;
                    }
                    return text;
                };

                const forceUpdateText = () => {
                    publishText.value = generateResultText();
                    ElementPlus.ElMessage.success('已刷新文案');
                };

                watch(() => [blindRunners.value, volunteers.value, selectedTeam.value], () => {
                    if (!isTextFocused.value) publishText.value = generateResultText();
                }, { deep: true });

                const copyToClipboard = () => {
                    navigator.clipboard.writeText(publishText.value);
                    ElementPlus.ElMessage.success('已成功复制当前队伍的发布文案！');
                };

                const resetData = () => { 
                    dataLoaded.value = false; 
                    selectedTeam.value = '';
                    blindRunners.value = []; 
                    volunteers.value = []; 
                    statusMap.value = {}; 
                    publishText.value = "";
                };

                return { 
                    dragOver, dataLoaded, blindRunners, volunteers,
                    selectedTeam, availableTeams, filteredBlindRunners, filteredVolunteers,
                    filteredUnassignedVolunteers, filteredUnassignedRunners, 
                    publishText, isTextFocused,
                    handleDrop, handleFileUpload, handleVolunteerChange,
                    getStatusColor, isVolunteerAssigned, getVolAge, 
                    generateResultText, copyToClipboard, resetData, autoPair, forceUpdateText
                };
            }
        });

        for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
        app.use(ElementPlus).mount('#app');
    </script>
</body>
</html>
